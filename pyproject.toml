[project]
name = "casevo"
version = "0.3.19"
description = "Cognitive agents and social evolution simulator"
authors = [
    {name = "Zexun Jiang",email = "jiangzx2023@cuc.edu.cn"},
]
dependencies = [
    "mesa==2.4.0",
    "chromadb>=0.5.0",
    "requests>=2.33.1",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache 2.0"}

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]
openai = [
    "openai>=1.0.0",
]
glm = [
    "openai>=1.0.0",
    "zhipuai>=2.1.5",
]
example = [
    "python-dotenv>=1.0.0",
]

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
